[project]
name = "goose-web"
version = "1.10.0"
description = "Goose AI Web Interface - a secure, multi-user web front end for the Goose AI agent (goose serve / ACP)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Goose Web contributors" }]
keywords = ["goose", "ai", "agent", "acp", "web", "multi-user"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Framework :: AsyncIO",
]
dependencies = [
    "starlette>=0.41",
    "uvicorn>=0.32",
    "websockets>=13.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ldap3>=2.9",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
goose-web = "goose_web.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["goose_web"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Project-local temp dir (git-ignored): some Windows hosts deny access to %TEMP%\pytest-of-<user>.
addopts = "--basetemp=.pytest_tmp -p no:cacheprovider"
