# docker compose -f docker/compose.yaml up -d --build
# Then open http://<host>:8710 and sign in as admin / ChangeMe (you must change it immediately).
# Put a TLS reverse proxy in front for anything beyond localhost and set GOOSE_WEB__SERVER__PUBLIC_URL.
name: goose-web

services:
  goose-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        GOOSE_VERSION: "1.57.0"
    image: goose-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8710:8710"          # change to "8710:8710" only behind a firewall / reverse proxy
    environment:
      GOOSE_WEB_ADMIN: admin
      # GOOSE_WEB__SERVER__PUBLIC_URL: https://goose.example.org
      # GOOSE_WEB__SERVER__TRUSTED_PROXIES: '["127.0.0.1", "172.16.0.0/12"]'
      TZ: UTC
    volumes:
      - goose-web-data:/data
      # Workspaces users may work in (add them to a team's allowed roots):
      # - /srv/projects:/workspaces
    read_only: true
    tmpfs:
      - /tmp
      - /home/goose:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    mem_limit: 4g

volumes:
  goose-web-data:
