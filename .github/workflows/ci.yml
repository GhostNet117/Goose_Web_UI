name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Every action is pinned by full commit SHA (the version is in the comment); Dependabot keeps them current.
jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      # Vendored static files are checked against SHA256SUMS byte for byte: keep LF on Windows too.
      - name: Check out with LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dependencies hash-locked)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install pytest pytest-asyncio
      - name: Test
        run: python -m pytest -q

  audit:
    name: pip-audit (requirements.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit the locked dependencies
        run: pip-audit -r requirements.lock
